name = "gone"
main = "worker.js"
compatibility_date = "2026-09-03"

# Put Cloudflare's tiered Workers Cache in front of this Worker. Individual
# responses still opt in or out through their cache-control headers.
[cache]
enabled = true

# Persist invocation logs and traces in Workers Observability.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Bundle logo.svg as a raw text string rather than a binary asset, so it can
# be base64-encoded into the page template at module load time.
[[rules]]
type = "Text"
globs = ["**/*.svg"]
fallthrough = true

[[routes]]
pattern = "vmst.io"
custom_domain = true

# Wildcard route for all vmst.io subdomains (www, matrix, docs, status, cdn,
# dna, and any future ones). Unlike custom_domain routes, this requires a
# wildcard DNS record (orange-clouded) to already exist in the zone, and
# Wrangler will not manage DNS/certs for it.
[[routes]]
pattern = "*.vmst.io/*"
zone_name = "vmst.io"
